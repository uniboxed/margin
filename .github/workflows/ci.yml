# Margin's checks on every pull request and every push to main: npm run gate's parts, each where it's meaningful.
# Linux: the type check and the unit tests (the security suite's unit half among them, with every theme package's
# checks: no browser). macOS: the browser tests (theme, with the security suite's browser half, and end to end) in
# Chromium and WebKit, the browsers Margin runs on, and the app's Swift checks and the WebKit host. Rust: on Linux with
# both Windows targets checked, and tested on Windows itself. The app's own end-to-end checks drive real windows and
# wait on macOS's window server, which a CI virtual machine is too slow for: they run in npm run gate, on a Mac, before
# main.
#
# Each job runs only when the change can reach it (the `changes` job, scripts/ci-plan.mts: a docs-only change runs
# nothing heavy), and the theme browser tests only for what it reaches: a theme's folder, that theme's tests; the UI
# runtime, the host page or the theme harness, the theme-agnostic tests against one reference theme (Arcadia). A job
# skipped that way counts as passed for the required checks, so if `changes` itself fails, everything runs. Every
# night (and when started by hand) everything runs: every theme, both engines. The macOS jobs run on every push once
# the repository variable MACOS_CI is "true" (it is), every night, or when started by hand.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly: everything, every theme, both engines, whatever changed (a pull request runs only what it reaches).
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      macos:
        description: Run the macOS jobs too
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "26"

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      unit: ${{ steps.plan.outputs.unit }}
      rust: ${{ steps.plan.outputs.rust }}
      app: ${{ steps.plan.outputs.app }}
      browsers_any: ${{ steps.plan.outputs.browsers_any }}
      browsers: ${{ steps.plan.outputs.browsers }}
      macos: ${{ steps.plan.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # (No npm ci: the plan is plain Node, with the theme list from extension/themes/packages.ts.)
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: plan
        name: The files this change touches, by what they can reach (scripts/ci-plan.mts)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          MACOS_INPUT: ${{ inputs.macos }}
          MACOS_VAR: ${{ vars.MACOS_CI }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$BEFORE" ;;
            *) base="" ;;
          esac
          if [ "$EVENT" = workflow_dispatch ]; then macos="$MACOS_INPUT"
          elif [ "$EVENT" = schedule ]; then macos=true
          else macos=$([ "$MACOS_VAR" = true ] && echo true || echo false); fi
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          export MACOS="$macos"
          # Nightly, by hand, a new branch, or a base that isn't here (a force-push): everything.
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            node scripts/ci-plan.mts --everything < /dev/null
          else
            git diff --name-only "$base" HEAD | node scripts/ci-plan.mts
          fi

  unit:
    name: Unit tests (Linux)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.unit == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: The type check and the unit tests
        run: npm test

  browsers:
    name: Browser tests (macOS, ${{ matrix.suite }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || (needs.changes.outputs.browsers_any == 'true' && needs.changes.outputs.macos == 'true')) }}
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # The plan's jobs (scripts/ci-plan.mts): the theme tests it picked, in the themes it picked (MARGIN_TEST_THEMES;
      # all of them on two Macs when everything runs), and the end-to-end tests in two halves, one file at a time
      # (npm run test:e2e runs two at once: a few of them wait on timers that two Chromiums at once on a virtual Mac
      # push past). If `changes` failed, everything.
      matrix: ${{ fromJSON(needs.changes.outputs.browsers || '{"include":[{"suite":"theme 1 of 2","kind":"theme","files":"tests/theme/*.test.ts","themes":"","shard":"1/2"},{"suite":"theme 2 of 2","kind":"theme","files":"tests/theme/*.test.ts","themes":"","shard":"2/2"},{"suite":"end to end 1 of 2","kind":"e2e","files":"tests/e2e/*.test.ts","themes":"","shard":"1/2"},{"suite":"end to end 2 of 2","kind":"e2e","files":"tests/e2e/*.test.ts","themes":"","shard":"2/2"}]}') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Playwright's browsers, cached by its version
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Chromium and WebKit (the theme tests run in both)
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit
      - name: Rust (stable, by the runner's own rustup), for the connector's end-to-end test
        if: matrix.kind == 'e2e'
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - if: matrix.kind == 'e2e'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Scroll bars that show while scrolling only, as on a Mac with a trackpad (the box patterns' setting)
        run: defaults write -g AppleShowScrollBars -string WhenScrolling
      - name: The build (the tests load it)
        run: node scripts/build.ts
      - name: ${{ matrix.suite }}
        env:
          FILES: ${{ matrix.files }}
          SHARD: ${{ matrix.shard }}
          MARGIN_TEST_THEMES: ${{ matrix.themes }}
        # ($FILES unquoted: a list of test files, or a glob in the fallback.)
        run: node --test --test-concurrency=1 --test-shard="$SHARD" $FILES
      - name: Test results, when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-macos-${{ strategy.job-index }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  rust:
    name: Rust (Linux, Windows targets checked)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Rust (stable, by the runner's own rustup)
        run: rustup toolchain install stable --profile minimal --no-self-update --component rustfmt,clippy --target x86_64-pc-windows-msvc,aarch64-pc-windows-msvc && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/rust-test.sh

  windows:
    name: Rust (Windows)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Rust (stable, by the runner's own rustup)
        run: rustup toolchain install stable --profile minimal --no-self-update --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # (Clippy first: it compiles everything the tests need, so the tests build on its work. The release build of
      # margin.exe is the release workflow's.)
      - name: Clippy on Windows
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests on Windows
        run: cargo test --workspace --locked

  macos:
    name: Margin.app (macOS)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || (needs.changes.outputs.app == 'true' && needs.changes.outputs.macos == 'true')) }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: The newest Xcode on the runner (not a beta)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)" && xcodebuild -version
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Rust (stable, by the runner's own rustup)
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The app's Swift checks
        run: node scripts/build.ts && tools/app-tests/run.sh unit
      - name: Scroll bars that show while scrolling only, as on a Mac with a trackpad (the box patterns' setting)
        run: defaults write -g AppleShowScrollBars -string WhenScrolling
      - name: The WebKit host (Safari's extension engine), its waits twice as long on a virtual Mac
        env:
          MARGIN_HOST_SLOW: "2"
        run: npm run test:webkit
