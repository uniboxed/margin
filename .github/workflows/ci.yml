# Margin's checks on every pull request and every push to main (npm run gate's parts, by where they can run).
# Linux: the extension's unit, theme, security and end-to-end tests in Chromium, and the Rust workspace with
# both Windows targets checked. Windows: the Rust workspace built and tested on Windows itself. macOS: the
# app's Swift checks, its end-to-end checks and the WebKit host. They run when started by hand, or on every
# push once the repository variable MACOS_CI is "true" (macOS minutes cost ten times more on a private repo;
# set it when the repo goes public, where they're free).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: Run the macOS jobs too
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "26"

jobs:
  extension:
    name: Extension (Linux, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Chromium and WebKit for the browser tests (the theme tests run in both), and an emoji font (space chips)
        run: |
          npx playwright install --with-deps chromium webkit
          sudo apt-get install -y --no-install-recommends fonts-noto-color-emoji
      - name: Rust (stable, by the runner's own rustup)
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Unit tests and the type check
        run: npm test
      - name: Theme tests
        run: npm run test:theme
      - name: Security tests
        run: npm run test:security
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Test results, when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  rust:
    name: Rust (Linux, Windows targets checked)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust (stable, by the runner's own rustup)
        run: rustup toolchain install stable --profile minimal --no-self-update --component rustfmt,clippy --target x86_64-pc-windows-msvc,aarch64-pc-windows-msvc && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: scripts/rust-test.sh

  windows:
    name: Rust (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust (stable, by the runner's own rustup)
        run: rustup toolchain install stable --profile minimal --no-self-update --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tests on Windows
        run: cargo test --workspace --locked
      - name: Clippy on Windows
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: margin.exe and margin-connector.exe
        run: cargo build --release --locked -p margin-windows -p margin-connector

  macos:
    name: Margin.app (macOS)
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.macos) ||
      (github.event_name != 'workflow_dispatch' && vars.MACOS_CI == 'true')
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: The newest Xcode on the runner (not a beta)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)" && xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Rust (stable, by the runner's own rustup)
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: The app's Swift checks and end-to-end checks
        run: npm run test:app
      - name: The WebKit host (Safari's extension engine)
        run: npm run test:webkit
