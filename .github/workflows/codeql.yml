# Code scanning with CodeQL: the extension's and the host page's TypeScript, the Rust workspace, and these
# workflows. Results go to the repository's Security tab. Code scanning needs the repository to be public (or
# GitHub Advanced Security): until then the job skips itself.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
          # docs/ holds design boards and notes, never shipped or run: their sketches' scripts aren't Margin's code.
          # Tests and tools stay scanned (their findings are dismissed one by one, with the reason).
          config: |
            paths-ignore:
              - docs/**
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
