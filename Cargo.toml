# Margin's Rust, one workspace for every part (docs/windows/BRIEF.md): margin-core (app/shared/core/) is OS-neutral
# and tested on any OS; margin-windows (app/platforms/windows/) is the Windows shell. Margin.app (app/platforms/macos/,
# Swift) links margin-core's hosting core through margin-ffi (app/platforms/macos/ffi/), a static library with a C interface.
[workspace]
resolver = "3"
members = ["app/shared/core", "app/platforms/macos/ffi", "app/shared/connector", "app/platforms/windows", "app/engines/chromium"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
hex = "0.4"
tempfile = "3"
libc = "0.2"
# The library's rules (app/shared/core/src/library/js.rs): JavaScript's `new URL` (WHATWG). Its `localeCompare` is the
# system's ICU, handed in by each platform (margin-ffi's libicucore, the Windows shell's icu.dll).
url = "2.5"
# The library's typed state keeps JavaScript's object key order (app/shared/core/src/library/state.rs `JsObject`); already
# serde_json's (`preserve_order`), so nothing new is built.
indexmap = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
