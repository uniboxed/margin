# Margin's Rust, one workspace for every part (docs/windows/BRIEF.md): margin-core (app/shared/core/) is OS-neutral
# and tested on any OS; margin-windows (app/platforms/windows/) is the Windows shell. macOS stays Swift (app/platforms/macos/).
[workspace]
resolver = "3"
members = ["app/shared/core", "app/shared/connector", "app/platforms/windows", "app/engines/chromium"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
base64 = "0.23"
getrandom = "0.3"
hex = "0.4"
tempfile = "3"
libc = "0.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
