<div class="lg" m-attr:data-mode="{{window.mode}}" m-attr:data-sidebar="{{window.sidebar}}" m-class:framed="{{window.frameWhenHidden}}" m-class:newtab="{{launcher}}" m-style:--space="{{space.color}}">

  <!-- Liquid Glass: the sidebar is one floating glass panel, 8 px in from the
       window's edges, over a soft ground in the space's color; the page is a
       card beside it with the same corner. The system's glass where Margin.app
       has it (theme.css, the @supports block), translucent fills elsewhere.
       Few glass layers: the panel, the address pill, the navigation and space
       capsules, the tab in front, and whatever floats (command bar, a menu). -->

  <div class="peek-zone" m-peek="left" aria-hidden="true"></div>

  <nav class="sidebar" aria-label="Sidebar">
    <!-- The panel: the one glass layer the rest of the sidebar sits in. (The resize handle is beside it, not in
         it: nothing of a glass element may reach past its box.) -->
    <div class="panel glass">
    <div class="column" m-swipe="spaces">

      <div class="window-bar">
        <m-window-controls class="window-controls"></m-window-controls>
        <m-drag-region class="drag-region"></m-drag-region>
      </div>

      <div class="toolbar">
        <button class="btn round" aria-label="Toggle sidebar" m-attr:aria-pressed="{{window.sidebarOpen}}" m-action="sidebar.toggle">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3.5"></rect><path d="M9.5 5v14"></path></svg>
        </button>
        <div class="grow"></div>
        <div class="nav capsule" role="group" aria-label="Navigation">
          <button class="btn round" aria-label="Back" m-action="nav.back">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"></path></svg>
          </button>
          <button class="btn round" aria-label="Forward" m-action="nav.forward">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"></path></svg>
          </button>
          <button class="btn round reload" aria-label="Reload" m-class:loading="{{tab.loading}}" m-action="nav.reload">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 5v4h-4"></path></svg>
          </button>
        </div>
      </div>

      <button class="btn address capsule" aria-label="Address: {{tab.url}}. Open command bar" m-action="palette.open">
        <svg class="ico lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="10.5" width="12" height="9" rx="2.5"></rect><path d="M8.75 10.5V8a3.25 3.25 0 0 1 6.5 0v2.5"></path></svg>
        <span class="host ellipsis">{{tab.host}}</span>
      </button>

      <m-if test="favorites.hasItems">
        <div class="favorites" role="list" aria-label="Favorites" m-drop="favorites" m-style:--fav-cols="{{favorites.columns}}">
          <m-for each="favorites.items" as="fav">
            <a class="btn favorite-tile" data-favorite-id="{{fav.id}}" title="{{fav.title}}" aria-label="{{fav.title}}" m-class:on="{{fav.active}}" m-class:open="{{fav.open}}" m-class:drifted="{{fav.drifted}}" m-class:audible="{{fav.audible}}" m-class:muted="{{fav.muted}}" m-action="favorite.open" m-arg="{{fav.id}}" m-drag="favorite">
              <m-if test="fav.icon">
                <img class="fav" alt="" m-class:app="{{fav.isApp}}" m-icon="{{fav.icon}}">
                <m-else><span class="fav letter" aria-hidden="true" m-style:--fav="{{fav.color}}">{{fav.letter}}</span></m-else>
              </m-if>
              <m-if test="fav.drifted"><span class="drift-dot" aria-hidden="true"></span></m-if>
            </a>
          </m-for>
        </div>
        <!-- No favorites yet: an empty drop target, drawn only while a tab or pin is dragged (nothing at rest). -->
        <m-else><div class="favorites-drop" aria-hidden="true" m-drop="favorites"><span class="favorites-drop-zone"></span></div></m-else>
      </m-if>

      <div class="space-head swipes">
        <h2 class="space-name" m-rename="space">{{space.name}}</h2>
        <span class="count">{{space.tabCount}}</span>
      </div>

      <div class="tabs swipes" m-scroll="tabs">
        <div class="folders" m-drop="pins">
          <m-for each="space.pinned" as="g">
            <m-if test="g.isFolder">
              <div class="folder" m-class:open="{{g.open}}" m-drop="folder">
                <button class="btn row folder-head" m-attr:aria-expanded="{{g.open}}" m-action="folder.toggle" m-arg="{{g.id}}" m-drag="folder">
                  <svg class="ico chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6 15.5 12l-6 6"></path></svg>
                  <svg class="ico folder-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8.2c0-1.5 1.2-2.7 2.7-2.7h3.1c.7 0 1.4.3 1.9.8l1 1h5.6c1.5 0 2.7 1.2 2.7 2.7v5.8c0 1.5-1.2 2.7-2.7 2.7H6.2a2.7 2.7 0 0 1-2.7-2.7Z"></path></svg>
                  <span class="folder-name" m-rename="folder">{{g.name}}</span>
                </button>
                <m-if test="g.hasShown">
                  <div class="folder-tabs">
                    <m-for each="g.shownFlat" as="t">
                      <m-if test="t.isFolder">
                        <button class="btn row folder-head nested" m-class:open="{{t.open}}" m-style:--depth="{{t.depth}}" m-attr:aria-expanded="{{t.open}}" m-action="folder.toggle" m-arg="{{t.id}}" m-drag="folder" m-drop="folder">
                          <svg class="ico chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6 15.5 12l-6 6"></path></svg>
                          <svg class="ico folder-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8.2c0-1.5 1.2-2.7 2.7-2.7h3.1c.7 0 1.4.3 1.9.8l1 1h5.6c1.5 0 2.7 1.2 2.7 2.7v5.8c0 1.5-1.2 2.7-2.7 2.7H6.2a2.7 2.7 0 0 1-2.7-2.7Z"></path></svg>
                          <span class="folder-name" m-rename="folder">{{t.name}}</span>
                        </button>
                        <m-else>
                          <a class="btn row tab pin" title="{{t.title}}" m-class:on="{{t.active}}" m-class:behind="{{t.behind}}" m-class:away="{{t.away}}" m-class:drifted="{{t.drifted}}" m-class:muted="{{t.muted}}" m-class:asleep="{{t.asleep}}" m-class:busy="{{t.loading}}" m-class:open="{{t.open}}" m-style:--depth="{{t.depth}}" m-action="pin.open" m-arg="{{t.id}}" m-drag="pin">
                            <m-if test="t.icon">
                              <img class="fav" alt="" m-class:app="{{t.isApp}}" m-icon="{{t.icon}}">
                              <m-else><span class="fav letter" m-style:--fav="{{t.color}}">{{t.letter}}</span></m-else>
                            </m-if>
                            <span class="title" m-rename="pin">{{t.title}}</span>
                            <m-if test="t.drifted">
                              <button class="btn reset" title="Reset to pinned URL" aria-label="Reset to pinned URL" m-action="pin.reset" m-arg="{{t.id}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 1 1 2.05 4.95M5 5v4h4"></path></svg></button>
                            </m-if>
                            <m-if test="t.audible"><svg class="ico audible" viewBox="0 0 24 24" role="img" aria-label="Playing audio"><path class="speaker" d="M4 9.5h3.2L12 5.8v12.4l-4.8-3.7H4Z"></path><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.7a7.5 7.5 0 0 1 0 10.6"></path></svg></m-if>
                            <m-if test="t.open">
                              <button class="btn close" aria-label="Close tab (stays pinned)" m-action="tab.close" m-arg="{{t.tabId}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 7.5l9 9M16.5 7.5l-9 9"></path></svg></button>
                            </m-if>
                          </a>
                        </m-else>
                      </m-if>
                    </m-for>
                  </div>
                </m-if>
              </div>
              <m-else>
                <!-- A pin outside the folders: a row like any other. -->
                <a class="btn row tab pin loose" title="{{g.title}}" m-class:on="{{g.active}}" m-class:behind="{{g.behind}}" m-class:away="{{g.away}}" m-class:drifted="{{g.drifted}}" m-class:muted="{{g.muted}}" m-class:asleep="{{g.asleep}}" m-class:busy="{{g.loading}}" m-class:open="{{g.open}}" m-action="pin.open" m-arg="{{g.id}}" m-drag="pin">
                  <m-if test="g.icon">
                    <img class="fav" alt="" m-class:app="{{g.isApp}}" m-icon="{{g.icon}}">
                    <m-else><span class="fav letter" m-style:--fav="{{g.color}}">{{g.letter}}</span></m-else>
                  </m-if>
                  <span class="title" m-rename="pin">{{g.title}}</span>
                  <m-if test="g.drifted">
                    <button class="btn reset" title="Reset to pinned URL" aria-label="Reset to pinned URL" m-action="pin.reset" m-arg="{{g.id}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 1 1 2.05 4.95M5 5v4h4"></path></svg></button>
                  </m-if>
                  <m-if test="g.audible"><svg class="ico audible" viewBox="0 0 24 24" role="img" aria-label="Playing audio"><path class="speaker" d="M4 9.5h3.2L12 5.8v12.4l-4.8-3.7H4Z"></path><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.7a7.5 7.5 0 0 1 0 10.6"></path></svg></m-if>
                  <m-if test="g.open">
                    <button class="btn close" aria-label="Close tab (stays pinned)" m-action="tab.close" m-arg="{{g.tabId}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 7.5l9 9M16.5 7.5l-9 9"></path></svg></button>
                  </m-if>
                </a>
              </m-else>
            </m-if>
          </m-for>
        </div>

        <div class="today-zone" m-drop="tabs">
          <div class="divider">
            <span class="hairline"></span>
            <m-if test="space.hasToday">
              <button class="btn clear" m-action="today.clear">Clear</button>
            </m-if>
          </div>

          <button class="btn row new-tab" m-class:on="{{space.newTab.active}}" m-action="tab.new">
            <svg class="ico plus" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"></path></svg>
            <span class="grow left">New Tab</span>
            <kbd class="kbd">⌘T</kbd>
          </button>

          <div class="today">
            <m-if test="space.hasSplits">
              <m-for each="space.splits" as="sp">
                <div class="split-row" data-split-id="{{sp.id}}" m-class:on="{{sp.active}}">
                  <m-for each="sp.panes" as="pane">
                    <button class="btn split-pane-btn" m-class:on="{{pane.active}}" title="{{pane.title}}" m-action="split.focus" m-arg="{{pane.tabId}}">
                      <m-if test="pane.icon">
                        <img class="fav" alt="" m-class:app="{{pane.isApp}}" m-icon="{{pane.icon}}">
                        <m-else><span class="fav letter" aria-hidden="true" m-style:--fav="{{pane.color}}">{{pane.letter}}</span></m-else>
                      </m-if>
                      <span class="title">{{pane.title}}</span>
                    </button>
                  </m-for>
                  <button class="btn split-swap" title="Swap split panes" aria-label="Swap split panes" m-action="split.swap" m-arg="{{sp.id}}">
                    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16M15 4l5 5-5 5M20 15H4M9 20l-5-5 5-5"></path></svg>
                  </button>
                </div>
              </m-for>
            </m-if>
            <m-for each="space.today" as="t">
              <a class="btn row tab" title="{{t.title}}" m-class:on="{{t.active}}" m-class:behind="{{t.behind}}" m-class:away="{{t.away}}" m-class:muted="{{t.muted}}" m-class:asleep="{{t.asleep}}" m-class:busy="{{t.loading}}" m-class:not-open="{{t.notOpen}}" m-action="tab.activate" m-arg="{{t.id}}" m-drag="tab">
                <m-if test="t.icon">
                  <img class="fav" alt="" m-class:app="{{t.isApp}}" m-icon="{{t.icon}}">
                  <m-else><span class="fav letter" m-style:--fav="{{t.color}}">{{t.letter}}</span></m-else>
                </m-if>
                <span class="title" m-rename="tab">{{t.title}}</span>
                <m-if test="t.audible"><svg class="ico audible" viewBox="0 0 24 24" role="img" aria-label="Playing audio"><path class="speaker" d="M4 9.5h3.2L12 5.8v12.4l-4.8-3.7H4Z"></path><path d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.7a7.5 7.5 0 0 1 0 10.6"></path></svg></m-if>
                <button class="btn close" aria-label="Close tab" m-action="tab.close" m-arg="{{t.id}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 7.5l9 9M16.5 7.5l-9 9"></path></svg></button>
              </a>
            </m-for>
          </div>
        </div>
      </div>

      <m-if test="media">
        <div class="mini-player" m-class:paused="{{media.paused}}">
          <button class="btn mini-info" title="{{media.title}}" aria-label="Jump to playing media" m-action="media.focus">
            <m-if test="media.artwork">
              <img class="mini-art" alt="" m-icon="{{media.artwork}}">
              <m-else>
                <m-if test="media.icon">
                  <img class="mini-art" alt="" m-icon="{{media.icon}}">
                  <m-else><span class="mini-art letter" aria-hidden="true" m-style:--fav="{{media.color}}">{{media.letter}}</span></m-else>
                </m-if>
              </m-else>
            </m-if>
            <span class="mini-text">
              <span class="mini-title">{{media.title}}</span>
              <m-if test="media.subtitle"><span class="mini-sub">{{media.subtitle}}</span></m-if>
            </span>
          </button>
          <div class="mini-controls">
            <m-if test="media.canPrev">
              <button class="btn round mini-btn" aria-label="Previous track" m-action="media.prev"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6v12M18 7l-8 5 8 5Z"></path></svg></button>
            </m-if>
            <button class="btn round mini-btn" aria-label="Play or pause" m-action="media.toggle">
              <m-if test="media.playing">
                <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"></path></svg>
                <m-else><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6l10 6-10 6Z"></path></svg></m-else>
              </m-if>
            </button>
            <m-if test="media.canNext">
              <button class="btn round mini-btn" aria-label="Next track" m-action="media.next"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6v12M6 7l8 5-8 5Z"></path></svg></button>
            </m-if>
            <button class="btn round mini-btn" aria-label="Mute or unmute" m-class:muted="{{media.muted}}" m-action="media.mute"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.2L12 5.8v12.4l-4.8-3.7H4Z"></path><path d="M15.5 9.2a4 4 0 0 1 0 5.6"></path></svg></button>
          </div>
        </div>
      </m-if>

      <!-- The space switcher: one capsule, the archive at one end, a new folder or space at the other. -->
      <div class="spaces capsule">
        <button class="btn round" aria-label="Archive and library" m-action="archive.open">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="4.5" rx="1.6"></rect><path d="M5 9.5v6.8a2.7 2.7 0 0 0 2.7 2.7h8.6a2.7 2.7 0 0 0 2.7-2.7V9.5M10 13h4"></path></svg>
        </button>
        <div class="chips" role="group" aria-label="Spaces">
          <m-for each="spaces" as="s">
            <button class="btn chip" aria-label="Switch to {{s.label}} space" title="{{s.label}}" m-attr:aria-pressed="{{s.active}}" m-class:on="{{s.active}}" m-style:--chip="{{s.color}}" m-action="space.switch" m-arg="{{s.id}}" m-drop="space">{{s.abbr}}</button>
          </m-for>
        </div>
        <button class="btn round" aria-label="New folder or space" m-action="menu.open" m-arg="add">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"></path></svg>
        </button>
      </div>

    </div>
    </div>
    <div class="resizer" m-resize="sidebar" title="Drag to resize · double-click to reset" aria-hidden="true"></div>
  </nav>

  <m-page class="page"></m-page>

  <!-- The page card while an item opens (Margin.app: m-page-state="loading"
       on the root): opaque, inside the card's hairline, with the
       "page-loader" part in it. Empty, and drawing nothing, otherwise. -->
  <m-page-loader class="page-loader"></m-page-loader>

  <!-- The page loading (the tab in front: its load, the page being left, a
       site's own navigation): a light running along the gutter above the
       page, seen with the sidebar hidden too. -->
  <div class="load-bar" m-class:on="{{tab.loading}}" aria-hidden="true"></div>

  <!-- Margin's trackpad gestures on the page (pull to refresh, swipe back and
       forward): a round badge over the page that comes in with the fingers
       and fills once letting go would do it. Never takes the pointer. -->
  <div class="page-over" aria-hidden="true">
    <m-if test="gesture.pull">
      <div class="gesture pull" m-class:armed="{{gesture.armed}}" m-class:done="{{gesture.done}}" m-class:leaving="{{gesture.leaving}}" m-style:--gesture="{{gesture.progress}}">
        <svg class="ico" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 5v4h-4"></path></svg>
      </div>
    </m-if>
    <m-if test="gesture.swipe">
      <div class="gesture swipe" m-class:back="{{gesture.back}}" m-class:forward="{{gesture.forward}}" m-class:armed="{{gesture.armed}}" m-class:done="{{gesture.done}}" m-class:leaving="{{gesture.leaving}}" m-style:--gesture="{{gesture.progress}}">
        <svg class="ico" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"></path></svg>
      </div>
    </m-if>
  </div>

  <m-launcher class="launcher-slot"></m-launcher>

  <!-- The page card's loader: one glass capsule on the card's ground, a small
       spinner, the opening app's icon (Safari's for a web item) and Margin's
       words in it ("Opening Safari…"). The one glass layer this adds is there
       only while an item opens. -->
  <template m-part="page-loader">
    <div class="opening" role="status">
      <span class="opening-spin" aria-hidden="true"></span>
      <m-if test="pageLoader.icon"><img class="opening-icon" alt="" aria-hidden="true" m-icon="{{pageLoader.icon}}"></m-if>
      <span class="opening-label">{{pageLoader.label}}</span>
    </div>
  </template>

  <!-- The command bar: a large glass panel in the middle of the window. -->
  <m-if test="palette.open">
    <div class="palette-layer">
      <button class="btn scrim" aria-label="Close command bar" m-action="palette.close"></button>
      <div class="palette glass" role="dialog" aria-label="New tab">
        <div class="palette-field">
          <svg class="ico search-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.75" cy="10.75" r="6.25"></circle><path d="M15.4 15.4 20 20"></path></svg>
          <!-- Site search (Arc's, shared/site-search.ts): the site searched as a pill in its colour; "Search <site>" with Tab while what's typed names one. -->
          <m-if test="palette.site"><span class="site-pill" m-style:--site="{{palette.site.color}}" m-style:--site-ink="{{palette.site.ink}}">{{palette.site.name}}</span></m-if>
          <input class="palette-input" m-input="palette" placeholder="Search or enter address" aria-label="Search or enter address" autocomplete="off" spellcheck="false">
          <m-if test="palette.siteHint"><span class="site-hint">{{palette.siteHint.verb}} {{palette.siteHint.name}} <kbd>Tab</kbd></span></m-if>
        </div>
        <!-- At most eight rows show; the rest scroll (Margin keeps the selected one in view). -->
        <div class="palette-rows" m-scroll="palette">
          <m-for each="palette.rows" as="r">
            <button class="btn row palette-row" title="{{r.title}}" m-class:on="{{r.selected}}" m-action="palette.run" m-arg="{{r.id}}">
              <m-if test="r.isSearch">
                <span class="fav glyph" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><circle cx="10.75" cy="10.75" r="6.25"></circle><path d="M15.4 15.4 20 20"></path></svg></span>
                <m-else>
              <m-if test="r.isOpen">
                <span class="fav glyph" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"></circle><path d="M3.5 12h17M12 3.5c-3.2 3.4-3.2 13.6 0 17M12 3.5c3.2 3.4 3.2 13.6 0 17"></path></svg></span>
                <m-else>
              <m-if test="r.emoji">
                <span class="fav emoji" aria-hidden="true">{{r.emoji}}</span>
                <m-else>
                  <m-if test="r.icon">
                    <img class="fav" alt="" m-class:app="{{r.isApp}}" m-icon="{{r.icon}}">
                    <m-else><span class="fav letter" aria-hidden="true" m-style:--fav="{{r.color}}">{{r.letter}}</span></m-else>
                  </m-if>
                </m-else>
              </m-if>
                </m-else>
              </m-if>
                </m-else>
              </m-if>
              <span class="title ellipsis">{{r.title}}</span>
              <m-if test="r.subtitle"><span class="subtitle ellipsis">{{r.subtitle}}</span></m-if>
              <span class="grow"></span>
              <!-- The row's place (its space, Archived, Search…), with that space's color as a dot. -->
              <m-if test="r.badge"><span class="tag" m-style:--tag="{{r.spaceColor}}">{{r.badge}}</span></m-if>
              <m-if test="r.goes"><svg class="ico enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6v5.5a3 3 0 0 1-3 3H6M9.5 10.5l-4 4 4 4"></path></svg></m-if>
            </button>
          </m-for>
        </div>
      </div>
    </div>
  </m-if>

  <m-menu class="menu-slot"></m-menu>
  <m-editor class="editor-slot"></m-editor>
  <m-notice class="notice-slot"></m-notice>
  <m-prompt class="prompt-slot"></m-prompt>
  <m-preview class="preview-slot"></m-preview>
  <m-toast class="toast-slot"></m-toast>

  <template m-part="toast">
    <div class="toast-pill" role="status" aria-live="polite">{{toast.text}}</div>
  </template>

  <template m-part="preview">
    <div class="preview-backdrop" m-class:loading="{{preview.loading}}" m-class:ready="{{preview.ready}}" m-class:closing="{{preview.closing}}" m-class:quick-tab="{{preview.isQuickTab}}">
      <button class="btn scrim" m-attr:aria-label="{{preview.labels.close}}" m-action="preview.close"></button>
      <div class="preview-dim" aria-hidden="true"></div>
      <div class="preview-card" role="dialog" m-attr:aria-label="{{preview.title}}">
        <div class="preview-bar">
          <m-if test="preview.isQuickTab">
            <input class="preview-field" type="text" m-input="preview" m-attr:placeholder="{{preview.labels.search}}" m-attr:aria-label="{{preview.labels.search}}" spellcheck="false" autocomplete="off">
            <m-else>
              <button class="btn round preview-btn" m-attr:aria-label="{{preview.labels.back}}" m-action="preview.back"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"></path></svg></button>
              <button class="btn round preview-btn" m-attr:aria-label="{{preview.labels.forward}}" m-action="preview.forward"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"></path></svg></button>
              <span class="preview-host ellipsis">{{preview.host}}</span>
              <button class="btn pill preview-btn" m-attr:title="{{preview.labels.copyUrl}}" m-attr:aria-label="{{preview.labels.copyUrl}}" m-action="preview.copyUrl">{{preview.labels.copyUrl}}</button>
              <button class="btn pill primary preview-btn" m-action="preview.expand">{{preview.labels.expand}}</button>
            </m-else>
          </m-if>
          <button class="btn round preview-btn preview-close" m-attr:aria-label="{{preview.labels.close}}" m-action="preview.close"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 7.5l9 9M16.5 7.5l-9 9"></path></svg></button>
        </div>
        <m-preview-page class="preview-page"></m-preview-page>
      </div>
    </div>
  </template>

  <template m-part="notice">
    <div class="notice glass" role="status">
      <span class="text">{{notice.text}}</span>
      <m-for each="notice.actions" as="a">
        <button class="btn pill" m-class:primary="{{a.primary}}" m-action="notice.run" m-arg="{{a.id}}">{{a.label}}</button>
      </m-for>
    </div>
  </template>

  <template m-part="prompt">
    <div class="prompt-layer">
      <div class="prompt glass" role="alertdialog" m-attr:aria-label="{{prompt.title}}">
        <div class="prompt-title">{{prompt.title}}</div>
        <div class="prompt-text">{{prompt.text}}</div>
        <div class="prompt-actions">
          <m-for each="prompt.actions" as="a">
            <button class="btn pill" m-class:primary="{{a.primary}}" m-class:danger="{{a.danger}}" m-action="prompt.run" m-arg="{{a.id}}">{{a.label}}</button>
          </m-for>
        </div>
      </div>
    </div>
  </template>

  <template m-part="launcher">
    <!-- Settings as its own page (Margin.app's Settings tab, margin://settings; the new-tab page's #settings): as
         macOS's System Settings, its categories in a sidebar and the one chosen beside it. Every word is Margin's. -->
    <m-if test="settingsTab">
      <main class="settings-page">
        <nav class="settings-nav" aria-label="{{settingsTab.title}}">
          <h1 class="settings-title">{{settingsTab.title}}</h1>
          <ul class="settings-categories">
            <m-for each="settingsTab.categories" as="c">
              <li>
                <button class="settings-category" m-class:selected="{{c.selected}}" m-attr:aria-current="{{c.selected}}" m-attr:data-category="{{c.id}}" m-action="settings.category" m-arg="{{c.id}}">
                  <span class="category-icon" aria-hidden="true">
                    <m-if test="c.isAppearance"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"></circle><path d="M12 4.5a7.5 7.5 0 0 1 0 15z" fill="currentColor" stroke="none"></path></svg></m-if>
                    <m-if test="c.isThemes"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg></m-if>
                    <m-if test="c.isTabs"><svg viewBox="0 0 24 24"><rect x="4" y="8.5" width="12" height="11" rx="2"></rect><path d="M8 5h9a3 3 0 0 1 3 3v8"></path></svg></m-if>
                    <m-if test="c.isBrowsing"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"></circle><path d="M4.5 12h15M12 4.5c2.1 2.1 3.2 4.6 3.2 7.5s-1.1 5.4-3.2 7.5c-2.1-2.1-3.2-4.6-3.2-7.5s1.1-5.4 3.2-7.5z"></path></svg></m-if>
                    <m-if test="c.isApps"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="6" height="6" rx="1.5"></rect><rect x="13" y="4" width="6" height="6" rx="1.5"></rect><rect x="3.5" y="14" width="17" height="6" rx="2"></rect></svg></m-if>
                    <m-if test="c.isKeyboard"><svg viewBox="0 0 24 24"><rect x="3" y="6.5" width="18" height="11" rx="2"></rect><path d="M7 10.5h.01M10.3 10.5h.01M13.7 10.5h.01M17 10.5h.01M8 14h8"></path></svg></m-if>
                  </span>
                  <span class="category-label">{{c.label}}</span>
                </button>
              </li>
            </m-for>
          </ul>
        </nav>
        <section class="settings-pane" m-attr:data-category="{{settingsTab.current.id}}">
          <header class="pane-head">
            <h2 class="pane-title">{{settingsTab.current.label}}</h2>
            <p class="pane-help">{{settingsTab.current.help}}</p>
          </header>
          <m-settings class="settings-slot"></m-settings>
        </section>
      </main>
    <m-else>
    <main class="launcher">
      <m-if test="launcher.canSearch"><input class="launcher-query" m-input="launcher" placeholder="Search or enter address" aria-label="Search or enter address" spellcheck="false" autocomplete="off"></m-if>
      <m-if test="launcher.hasPins">
        <section>
          <h2>Pinned</h2>
          <ul class="pin-tiles">
            <m-for each="launcher.pins" as="p">
              <li>
                <a class="tile" title="{{p.url}}" m-action="pin.open" m-arg="{{p.id}}">
                  <m-if test="p.icon">
                    <img class="fav" alt="" m-class:app="{{p.isApp}}" m-icon="{{p.icon}}">
                    <m-else><span class="fav letter" m-style:--fav="{{p.color}}">{{p.letter}}</span></m-else>
                  </m-if>
                  <span class="title">{{p.title}}</span>
                </a>
              </li>
            </m-for>
          </ul>
        </section>
      </m-if>
      <m-if test="launcher.hasArchive">
        <section>
          <h2>Recently archived</h2>
          <ul class="archive-list">
            <m-for each="launcher.archive" as="a">
              <li>
                <a class="archive-row" title="{{a.url}}" m-action="archive.restore" m-arg="{{a.id}}">
                  <m-if test="a.icon">
                    <img class="fav" alt="" m-class:app="{{a.isApp}}" m-icon="{{a.icon}}">
                    <m-else><span class="fav letter" m-style:--fav="{{a.color}}">{{a.letter}}</span></m-else>
                  </m-if>
                  <span class="title">{{a.title}}</span>
                  <span class="when">{{a.ago}}</span>
                </a>
              </li>
            </m-for>
          </ul>
          <m-if test="launcher.more">
            <button class="btn pill more" m-action="launcher.more">{{launcher.moreLabel}}</button>
          </m-if>
        </section>
      </m-if>
      <!-- Settings under the search field: not in Margin.app's window, where Settings is its own tab. -->
      <m-if test="launcher.hasSettings">
        <section class="settings-section">
          <m-if test="launcher.settingsPage"><h1>Settings</h1></m-if>
          <m-if test="launcher.canSearch"><button class="btn pill" m-attr:aria-expanded="{{launcher.settingsOpen}}" m-action="settings.open">Settings</button></m-if>
          <m-settings></m-settings>
        </section>
      </m-if>
    </main>
    </m-else>
    </m-if>
  </template>

  <template m-part="settings">
    <div class="settings-form">
      <m-for each="settingsForm.fields" as="f">
        <m-if test="f.isGroup"><div class="setting-group" role="heading" aria-level="3">{{f.label}}</div></m-if>
        <m-if test="f.isInfo"><p class="help">{{f.label}}</p></m-if>
        <m-if test="f.isNumber"><label class="setting"><span>{{f.label}}</span><input class="number" m-input="setting-number"></label></m-if>
        <m-if test="f.isToggle"><label class="setting" m-class:disabled="{{f.disabled}}"><span>{{f.label}}</span><input class="toggle" m-input="setting-toggle"></label></m-if>
        <m-if test="f.isChoice">
          <label class="setting"><span>{{f.label}}</span><select m-input="setting-choice"></select></label>
          <m-if test="f.hasStatus"><p class="help" role="status" m-class:error="{{f.error}}">{{f.status}}</p></m-if>
        </m-if>
        <m-if test="f.isList"><label class="setting stacked"><span>{{f.label}}</span><textarea m-input="setting-list" rows="3" spellcheck="false"></textarea></label></m-if>
        <m-if test="f.isColor"><label class="setting" m-class:theme-own="{{f.fromTheme}}"><span>{{f.label}}</span><input class="color" m-input="setting-color"></label></m-if>
        <m-if test="f.isShortcut"><label class="setting"><span>{{f.label}}</span><input class="shortcut" m-input="setting-shortcut" m-class:recording="{{f.recording}}"></label></m-if>
        <m-if test="f.isButton">
          <div class="actions">
            <button class="btn pill" m-action="settings.run" m-arg="{{f.id}}">{{f.label}}</button>
            <m-if test="f.hasStatus"><span class="help" role="status" m-class:error="{{f.error}}">{{f.status}}</span></m-if>
          </div>
        </m-if>
      </m-for>
    </div>
  </template>

  <template m-part="menu">
    <div class="menu glass" role="menu" m-attr:aria-label="{{menu.label}}">
      <m-for each="menu.items" as="i">
        <m-if test="i.separator">
          <div class="menu-sep" role="separator"></div>
          <m-else>
            <button class="btn menu-item" role="menuitem" m-class:danger="{{i.danger}}" m-class:confirming="{{i.confirming}}" m-action="menu.run" m-arg="{{i.id}}">{{i.label}}</button>
          </m-else>
        </m-if>
      </m-for>
    </div>
  </template>

  <template m-part="space-editor">
    <div class="editor-layer">
      <button class="btn scrim clear-scrim" m-attr:aria-label="{{editor.labels.cancel}}" m-action="editor.cancel"></button>
      <div class="editor glass" role="dialog" m-attr:aria-label="{{editor.labels.title}}">
        <div class="editor-title">{{editor.labels.title}}</div>
        <div class="editor-row">
          <input class="editor-emoji" m-input="space-emoji" maxlength="8" m-attr:aria-label="{{editor.labels.emoji}}" autocomplete="off" spellcheck="false">
          <input class="editor-name" m-input="space-name" maxlength="40" m-attr:placeholder="{{editor.labels.name}}" m-attr:aria-label="{{editor.labels.name}}" m-attr:disabled="{{editor.nameLocked}}" autocomplete="off" spellcheck="false">
        </div>
        <m-if test="editor.nameLocked"><div class="editor-note">{{editor.labels.note}}</div></m-if>
        <div class="swatches" role="radiogroup" m-attr:aria-label="{{editor.labels.colors}}">
          <m-for each="editor.colors" as="c">
            <button class="btn swatch" role="radio" m-attr:aria-checked="{{c.selected}}" m-class:on="{{c.selected}}" m-style:--swatch="{{c.color}}" m-action="editor.color" m-arg="{{c.id}}"></button>
          </m-for>
        </div>
        <m-if test="editor.hasThemes">
          <div class="theme-choices" role="radiogroup" m-attr:aria-label="{{editor.labels.theme}}">
            <m-for each="editor.themes" as="t">
              <button class="btn theme-choice" role="radio" m-attr:aria-checked="{{t.selected}}" m-class:on="{{t.selected}}" m-action="editor.theme" m-arg="{{t.id}}">{{t.name}}</button>
            </m-for>
          </div>
        </m-if>
        <div class="editor-row actions">
          <button class="btn pill danger" title="{{editor.deleteTitle}}" m-attr:disabled="{{editor.cannotDelete}}" m-class:confirming="{{editor.confirmDelete}}" m-action="editor.delete">{{editor.deleteLabel}}</button>
          <div class="grow"></div>
          <button class="btn pill" m-action="editor.cancel">{{editor.labels.cancel}}</button>
          <button class="btn pill primary" m-action="editor.save">{{editor.labels.save}}</button>
        </div>
      </div>
    </div>
  </template>
</div>
