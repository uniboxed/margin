<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Margin</title>
<!-- Margin.app's overlay (app/overlay/overlay.js). The app serves it with its Content Security Policy (app/shell/OverlayWebView.swift). -->
<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:100%;height:100%}
html[data-reconnecting] body>:not(#margin-reconnecting){opacity:.45;filter:saturate(.4);pointer-events:none}
#margin-reconnecting{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:8px 14px;border-radius:8px;font:13px -apple-system,system-ui,sans-serif;color:#fff;background:rgba(30,30,30,.85);pointer-events:none;z-index:2147483647}</style>
<script src="overlay.js" defer></script>
</head>
<body></body>
</html>
