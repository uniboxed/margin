<div class="nb" m-attr:data-mode="{{window.mode}}" m-attr:data-sidebar="{{window.sidebar}}" m-style:--space="{{space.color}}">

  <div class="peek-zone" m-peek="left" aria-hidden="true"></div>

  <nav class="sidebar" aria-label="Sidebar">
    <div class="column" m-swipe="spaces">

      <div class="window-bar">
        <m-window-controls class="window-controls"></m-window-controls>
        <m-drag-region class="drag-region"></m-drag-region>
      </div>

      <div class="toolbar">
        <button class="btn push sq" aria-label="Toggle sidebar" m-attr:aria-pressed="{{window.sidebarOpen}}" m-action="sidebar.toggle">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15"></rect><path d="M9.5 4.5v15"></path></svg>
        </button>
        <div class="grow"></div>
        <button class="btn push sq" aria-label="Back" m-action="nav.back">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
        </button>
        <button class="btn push sq" aria-label="Forward" m-action="nav.forward">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </button>
        <button class="btn push sq" aria-label="Reload" m-class:loading="{{tab.loading}}" m-action="nav.reload">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4"></path></svg>
        </button>
      </div>

      <button class="btn push address" aria-label="Address: {{tab.url}}. Open command bar" m-action="palette.open">
        <svg class="ico lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="10.5" width="13" height="9"></rect><path d="M8.5 10.5V7a3.5 3.5 0 0 1 7 0v3.5"></path></svg>
        <span class="ellipsis">{{tab.host}}</span>
      </button>

      <div class="space-head swipes">
        <h2 class="space-name" m-rename="space">{{space.name}}</h2>
        <span class="pill">{{space.tabCount}} TABS</span>
      </div>

      <div class="tabs swipes" m-scroll="tabs">
        <div class="folders" m-drop="pins">
          <m-for each="space.pinned" as="g">
            <m-if test="g.isFolder">
              <div class="folder" m-class:open="{{g.open}}" m-drop="folder">
                <button class="btn row folder-head" m-attr:aria-expanded="{{g.open}}" m-action="folder.toggle" m-arg="{{g.id}}" m-drag="folder">
                  <svg class="ico chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
                  <span class="folder-name" m-rename="folder">{{g.name}}</span>
                  <span class="folder-count">{{g.count}}</span>
                </button>
                <m-if test="g.hasShown">
                  <div class="folder-tabs">
                    <m-for each="g.shown" as="t">
                      <button class="btn row tab pin" title="{{t.title}}" m-class:on="{{t.active}}" m-class:asleep="{{t.asleep}}" m-class:open="{{t.open}}" m-action="pin.open" m-arg="{{t.id}}" m-drag="pin">
                        <m-if test="t.icon">
                          <img class="fav" alt="" m-icon="{{t.icon}}">
                          <m-else><span class="fav letter" m-style:--fav="{{t.color}}">{{t.letter}}</span></m-else>
                        </m-if>
                        <span class="title">{{t.title}}</span>
                      </button>
                    </m-for>
                  </div>
                </m-if>
              </div>
              <m-else>
                <button class="btn row tab pin loose" title="{{g.title}}" m-class:on="{{g.active}}" m-class:asleep="{{g.asleep}}" m-action="pin.open" m-arg="{{g.id}}" m-drag="pin">
                  <m-if test="g.icon">
                    <img class="fav" alt="" m-icon="{{g.icon}}">
                    <m-else><span class="fav letter" m-style:--fav="{{g.color}}">{{g.letter}}</span></m-else>
                  </m-if>
                  <span class="title">{{g.title}}</span>
                </button>
              </m-else>
            </m-if>
          </m-for>
        </div>

        <div class="today-zone" m-drop="tabs">
          <div class="divider">
            <span class="dash"></span>
            <m-if test="space.hasToday">
              <button class="btn push clear" m-action="today.clear">CLEAR ↓</button>
            </m-if>
          </div>

          <button class="btn push new-tab" m-class:on="{{space.newTab.active}}" m-action="tab.new">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            <span class="grow left">NEW TAB</span>
            <kbd class="kbd">⌘T</kbd>
          </button>

          <div class="today">
            <m-for each="space.today" as="t">
              <button class="btn row tab" title="{{t.title}}" m-class:on="{{t.active}}" m-class:asleep="{{t.asleep}}" m-action="tab.activate" m-arg="{{t.id}}" m-drag="tab">
                <m-if test="t.icon">
                  <img class="fav" alt="" m-icon="{{t.icon}}">
                  <m-else><span class="fav letter" m-style:--fav="{{t.color}}">{{t.letter}}</span></m-else>
                </m-if>
                <span class="title">{{t.title}}</span>
              </button>
            </m-for>
          </div>
        </div>
      </div>

      <div class="spaces">
        <button class="btn push sq big" aria-label="Archive and library" m-action="archive.open">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="4.5"></rect><path d="M5 9v11h14V9M10 13h4"></path></svg>
        </button>
        <div class="chips" role="group" aria-label="Spaces">
          <m-for each="spaces" as="s">
            <button class="btn chip" aria-label="Switch to {{s.name}} space" m-attr:aria-pressed="{{s.active}}" m-class:on="{{s.active}}" m-style:--chip="{{s.color}}" m-action="space.switch" m-arg="{{s.id}}" m-drop="space">{{s.abbr}}</button>
          </m-for>
        </div>
        <button class="btn push sq big" aria-label="New folder or space" m-action="menu.open" m-arg="add">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
      </div>

    </div>
    <div class="resizer" m-resize="sidebar" title="Drag to resize · double-click to reset" aria-hidden="true"></div>
  </nav>

  <m-page class="page"></m-page>

  <m-if test="palette.open">
    <div class="palette-layer">
      <button class="btn scrim" aria-label="Close command bar" m-action="palette.close"></button>
      <div class="palette" role="dialog" aria-label="New tab">
        <label class="palette-label" for="palette-input">SEARCH OR TYPE A URL</label>
        <input id="palette-input" class="palette-input" m-input="palette" placeholder="Go anywhere…" autocomplete="off" spellcheck="false">
        <m-for each="palette.rows" as="r">
          <button class="btn row palette-row" m-class:on="{{r.selected}}" m-action="palette.run" m-arg="{{r.id}}">
            <span class="tag" m-style:--tag="{{r.color}}">{{r.badge}}</span>
            <span class="grow left ellipsis">{{r.title}}</span>
            <span class="enter">↵</span>
          </button>
        </m-for>
      </div>
    </div>
  </m-if>

  <m-menu class="menu-slot"></m-menu>
  <m-editor class="editor-slot"></m-editor>

  <template m-part="menu">
    <div class="menu" role="menu" aria-label="Menu">
      <m-for each="menu.items" as="i">
        <m-if test="i.separator">
          <div class="menu-sep" role="separator"></div>
          <m-else>
            <button class="btn menu-item" role="menuitem" m-class:danger="{{i.danger}}" m-class:confirming="{{i.confirming}}" m-action="menu.run" m-arg="{{i.id}}">{{i.label}}</button>
          </m-else>
        </m-if>
      </m-for>
    </div>
  </template>

  <template m-part="space-editor">
    <div class="editor-layer">
      <button class="btn scrim" aria-label="Cancel" m-action="editor.cancel"></button>
      <div class="editor" role="dialog" aria-label="Edit space">
        <div class="editor-title">EDIT SPACE</div>
        <div class="editor-row">
          <input class="editor-emoji" m-input="space-emoji" maxlength="8" aria-label="Space emoji" autocomplete="off" spellcheck="false">
          <input class="editor-name" m-input="space-name" maxlength="40" placeholder="Space name" aria-label="Space name" autocomplete="off" spellcheck="false">
        </div>
        <div class="swatches" role="radiogroup" aria-label="Space color">
          <m-for each="editor.colors" as="c">
            <button class="btn swatch" role="radio" m-attr:aria-checked="{{c.selected}}" m-class:on="{{c.selected}}" m-style:--swatch="{{c.color}}" m-action="editor.color" m-arg="{{c.id}}"></button>
          </m-for>
        </div>
        <div class="editor-row actions">
          <button class="btn push small danger" title="{{editor.deleteTitle}}" m-attr:disabled="{{editor.cannotDelete}}" m-class:confirming="{{editor.confirmDelete}}" m-action="editor.delete">{{editor.deleteLabel}}</button>
          <div class="grow"></div>
          <button class="btn push small" m-action="editor.cancel">CANCEL</button>
          <button class="btn push small primary" m-action="editor.save">SAVE</button>
        </div>
      </div>
    </div>
  </template>
</div>
