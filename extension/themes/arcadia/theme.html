<div class="arcadia" m-attr:data-mode="{{window.mode}}" m-attr:data-sidebar="{{window.sidebar}}" m-class:framed="{{window.frameWhenHidden}}" m-class:loading="{{tab.loading}}" m-class:newtab="{{launcher}}" m-style:--space-color="{{space.color}}">

  <!-- The page card: the browser's page goes in its box (Margin's <m-page>).
       Its huge spread shadow is the gray frame around it (Arc's), so the
       card itself stays clear. -->
  <m-page class="page"></m-page>

  <!-- The hover zone at the left edge that brings a hidden sidebar out (m-peek). -->
  <div class="peek-zone" m-peek="left" aria-hidden="true"></div>

  <aside class="margin-sidebar" aria-label="Margin" m-swipe="spaces">
    <header class="top">
      <m-window-controls class="window-controls"></m-window-controls>
      <m-if test="window.pinnedOpen">
        <button class="keep-open" title="Auto-hide the sidebar" aria-label="Auto-hide the sidebar" aria-pressed="true" m-action="sidebar.toggle">
          <svg class="line-icon toggle-icon" viewBox="0 0 19 15" aria-hidden="true"><rect x="0.75" y="0.75" width="17.5" height="13.5" rx="3"></rect><path d="M6.25 0.75v13.5M2.75 4h1.5M2.75 6.5h1.5M2.75 9h1.5"></path></svg>
        </button>
        <m-else>
          <button class="keep-open" title="Keep the sidebar open" aria-label="Keep the sidebar open" aria-pressed="false" m-action="sidebar.toggle">
            <svg class="line-icon toggle-icon" viewBox="0 0 19 15" aria-hidden="true"><rect x="0.75" y="0.75" width="17.5" height="13.5" rx="3"></rect><path d="M6.25 0.75v13.5M2.75 4h1.5M2.75 6.5h1.5M2.75 9h1.5"></path></svg>
          </button>
        </m-else>
      </m-if>
      <m-drag-region class="spacer"></m-drag-region>
      <button class="bar-button address" title="{{tab.url}}" aria-label="Search or enter address" m-action="palette.open">
        <svg class="line-icon search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3.3a7.2 7.2 0 1 0 0 14.4 7.2 7.2 0 0 0 0-14.4Z"></path><path d="M15.6 15.6 19.5 19.5"></path></svg>
      </button>
    </header>

    <!-- The space's part (its name, the editor, the list): what a sideways swipe moves. -->
    <div class="space-pane">
      <div class="space-title">
        <span class="emoji" aria-hidden="true">{{space.emoji}}</span>
        <span class="title" m-rename="space">{{space.name}}</span>
      </div>

      <m-editor class="editor-slot"></m-editor>

      <section class="tabs-section" m-scroll="tabs">
        <div class="pins-section">
          <div class="pins" role="list" aria-label="Pinned" m-class:has="{{space.hasPinned}}" m-drop="pins">
            <m-for each="space.pinned" as="g">
              <m-if test="g.isFolder">
                <a class="folder" role="button" tabindex="0" m-class:open="{{g.open}}" m-attr:aria-expanded="{{g.open}}" m-action="folder.toggle" m-arg="{{g.id}}" m-drag="folder" m-drop="folder">
                  <span class="folder-toggle">
                    <m-if test="g.open">
                      <svg class="folder-icon open" viewBox="0 0 22.5 16.5" aria-hidden="true"><path class="folder-back" d="M5.2 15.9Q4.4 15.9 4.2 15.1L.75 2.2Q.4.6 2 .6H5.6Q6.3.6 6.8 1.1L8.2 2.6Q8.6 3 9.2 3.05L20.6 4.1Q21.6 4.2 21.4 5.2L17.9 15.9Z"></path><path class="folder-front" d="M8.7 5.2H21.1Q22 5.2 21.7 6.1L18.6 15.3Q18.4 15.9 17.7 15.9H5Q4.15 15.9 4.4 15.1L7.4 6.3Q7.75 5.2 8.7 5.2Z"></path></svg>
                      <m-else>
                        <svg class="folder-icon" viewBox="0 0 22.5 16.5" aria-hidden="true"><path class="folder-back" d="M1 2.1Q1 .6 2.5 .6H6.6Q7.2.6 7.6 1.1L8.9 2.6H20Q21.5 2.6 21.5 4.1V14.4Q21.5 15.9 20 15.9H2.5Q1 15.9 1 14.4Z"></path><path class="folder-front" d="M1 6.3Q1 4.8 2.5 4.8H20Q21.5 4.8 21.5 6.3V14.4Q21.5 15.9 20 15.9H2.5Q1 15.9 1 14.4Z"></path></svg>
                      </m-else>
                    </m-if>
                    <span class="title" m-rename="folder">{{g.name}}</span>
                  </span>
                </a>
                <m-for each="g.shown" as="p">
                  <a class="pin nested" m-class:active="{{p.active}}" m-class:behind="{{p.behind}}" m-class:open="{{p.open}}" m-class:asleep="{{p.asleep}}" aria-label="{{p.title}}" m-action="pin.open" m-arg="{{p.id}}" m-drag="pin">
                      <m-if test="p.icon">
                        <img class="avatar" alt="" m-icon="{{p.icon}}">
                        <m-else><span class="avatar letter" aria-hidden="true" m-style:--letter="{{p.color}}">{{p.letter}}</span></m-else>
                      </m-if>
                      <span class="title">{{p.title}}</span>
                    <m-if test="p.audible">
                      <svg class="audible-icon" viewBox="0 0 16 16" aria-label="Playing audio"><path class="speaker" d="M2.5 6h2l3-2.5v9L4.5 10h-2Z"></path><path d="M10 5.5a3.5 3.5 0 0 1 0 5M11.8 3.7a6 6 0 0 1 0 8.6"></path></svg>
                    </m-if>
                    <m-if test="p.open">
                      <button class="icon close" aria-label="Close tab (stays pinned)" m-action="tab.close" m-arg="{{p.tabId}}">
                        <svg class="line-icon close-icon" viewBox="0 0 11 11" aria-hidden="true"><path d="M1 1l9 9M10 1l-9 9"></path></svg>
                      </button>
                    </m-if>
                  </a>
                </m-for>
                <m-else>
                  <a class="pin" m-class:active="{{g.active}}" m-class:behind="{{g.behind}}" m-class:open="{{g.open}}" m-class:asleep="{{g.asleep}}" aria-label="{{g.title}}" m-action="pin.open" m-arg="{{g.id}}" m-drag="pin">
                      <m-if test="g.icon">
                        <img class="avatar" alt="" m-icon="{{g.icon}}">
                        <m-else><span class="avatar letter" aria-hidden="true" m-style:--letter="{{g.color}}">{{g.letter}}</span></m-else>
                      </m-if>
                      <span class="title">{{g.title}}</span>
                    <m-if test="g.audible">
                      <svg class="audible-icon" viewBox="0 0 16 16" aria-label="Playing audio"><path class="speaker" d="M2.5 6h2l3-2.5v9L4.5 10h-2Z"></path><path d="M10 5.5a3.5 3.5 0 0 1 0 5M11.8 3.7a6 6 0 0 1 0 8.6"></path></svg>
                    </m-if>
                    <m-if test="g.open">
                      <button class="icon close" aria-label="Close tab (stays pinned)" m-action="tab.close" m-arg="{{g.tabId}}">
                        <svg class="line-icon close-icon" viewBox="0 0 11 11" aria-hidden="true"><path d="M1 1l9 9M10 1l-9 9"></path></svg>
                      </button>
                    </m-if>
                  </a>
                </m-else>
              </m-if>
            </m-for>
            <div class="drop-hint" aria-hidden="true">Drop to pin</div>
          </div>
        </div>
        <m-if test="space.hasPinned">
          <div class="divider"></div>
        </m-if>

        <div class="tabs" role="list" aria-label="Tabs" m-drop="tabs">
          <a class="new-tab-row" role="button" aria-label="New Tab" m-class:active="{{space.newTab.active}}" m-attr:aria-current="{{space.newTab.active}}" m-action="tab.new">
            <span class="plus" aria-hidden="true"><svg class="line-icon plus-icon" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v12M1 7h12"></path></svg></span>
            <span class="title">New Tab</span>
          </a>
          <m-for each="space.today" as="t">
            <a class="tab" m-class:active="{{t.active}}" m-class:behind="{{t.behind}}" m-class:asleep="{{t.asleep}}" aria-label="{{t.title}}" m-action="tab.activate" m-arg="{{t.id}}" m-drag="tab">
                <m-if test="t.icon">
                  <img class="avatar" alt="" m-icon="{{t.icon}}">
                  <m-else><span class="avatar letter" aria-hidden="true" m-style:--letter="{{t.color}}">{{t.letter}}</span></m-else>
                </m-if>
                <span class="title">{{t.title}}</span>
              <m-if test="t.audible">
                <svg class="audible-icon" viewBox="0 0 16 16" aria-label="Playing audio"><path class="speaker" d="M2.5 6h2l3-2.5v9L4.5 10h-2Z"></path><path d="M10 5.5a3.5 3.5 0 0 1 0 5M11.8 3.7a6 6 0 0 1 0 8.6"></path></svg>
              </m-if>
              <button class="icon close" aria-label="Close tab" m-action="tab.close" m-arg="{{t.id}}">
                <svg class="line-icon close-icon" viewBox="0 0 11 11" aria-hidden="true"><path d="M1 1l9 9M10 1l-9 9"></path></svg>
              </button>
            </a>
          </m-for>
        </div>
      </section>
    </div>

    <!-- The bottom bar (Arc): archive at the left, the spaces in the middle, "+" at the right. -->
    <footer class="bar">
      <button class="bar-button archive" title="Archived tabs" aria-label="Archived tabs" m-action="archive.open">
        <svg class="fill-icon archive-icon" viewBox="0 0 14 16.5" aria-hidden="true"><path fill-rule="evenodd" d="M2 7.5H13Q13.5 7.5 13.5 8V13.5Q13.5 16.5 10.5 16.5H4.5Q1.5 16.5 1.5 13.5V8Q1.5 7.5 2 7.5ZM6.5 8.5H8.5A1 1 0 0 1 8.5 10.5H6.5A1 1 0 0 1 6.5 8.5Z"></path><path d="M.9 6.1Q.4 6 .2 5.3L0 4.7Q0 4 .7 3.9L2.8 3.6L4 1.4Q4.35.85 4.75 1.4L5.95 3.1L8.6 3.2Q9.25 3.25 9.05 3.85L8.4 5.7Q8.25 6.1 7.8 6.1Z"></path><path d="M11.4 2.9Q11.8 2.3 12.2 2.9L14 5.2Q14.3 5.7 13.8 5.9L11.3 6.4Q10.6 6.5 10.6 5.8Z"></path><circle cx="9.5" cy="1" r="1"></circle></svg>
      </button>
      <nav class="spaces" aria-label="Spaces">
        <m-for each="spaces" as="s">
          <button class="chip" m-class:active="{{s.active}}" title="{{s.name}}" m-attr:aria-pressed="{{s.active}}" m-style:--chip-color="{{s.color}}" m-action="space.switch" m-arg="{{s.id}}" m-drop="space">{{s.emoji}}</button>
        </m-for>
      </nav>
      <button class="bar-button add" title="New folder or space" aria-label="New folder or space" m-action="menu.open" m-arg="add">
        <svg class="line-icon plus-icon" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v12M1 7h12"></path></svg>
      </button>
    </footer>

    <!-- Resize handle: the sidebar's right edge (160–500 px, the sidebarWidth setting). -->
    <div class="resizer" m-resize="sidebar" title="Drag to resize · double-click to reset" aria-hidden="true"></div>
  </aside>

  <!-- The card's soft shadow, above the sidebar so it also falls on its edge,
       and the page-load pill in the frame's top strip. -->
  <div class="card-edge" aria-hidden="true">
    <div class="loader"><div class="loader-bar"></div></div>
  </div>

  <!-- The new-tab page's launcher, in the page card (while the UI is drawn in Margin's new-tab page). -->
  <m-launcher class="launcher-slot"></m-launcher>

  <!-- Arc's command bar. -->
  <m-if test="palette.open">
    <div class="palette-layer">
      <button class="backdrop" aria-label="Close the command bar" m-action="palette.close"></button>
      <div class="palette" role="dialog" aria-label="Margin command palette">
        <div class="search">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3.3a7.2 7.2 0 1 0 0 14.4 7.2 7.2 0 0 0 0-14.4Z"></path><path d="M15.6 15.6 19.5 19.5"></path></svg>
          <input class="query" type="text" m-input="palette" placeholder="Search or Enter URL…" aria-label="Command palette" spellcheck="false" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="margin-results">
        </div>
        <div class="results" id="margin-results" role="listbox">
          <m-for each="palette.rows" as="r">
            <a class="result" role="option" title="{{r.title}}" m-attr:aria-selected="{{r.selected}}" m-action="palette.run" m-arg="{{r.id}}">
                <m-if test="r.emoji">
                  <span class="avatar emoji">{{r.emoji}}</span>
                  <m-else>
                    <m-if test="r.icon">
                      <img class="avatar" alt="" m-icon="{{r.icon}}">
                      <m-else><span class="avatar letter" aria-hidden="true" m-style:--letter="{{r.color}}">{{r.letter}}</span></m-else>
                    </m-if>
                  </m-else>
                </m-if>
                <span class="title">{{r.title}}</span>
                <m-if test="r.badge"><span class="badge">{{r.badge}}</span></m-if>
                <m-if test="r.goes">
                  <span class="go-button"><svg class="arrow-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12h14.5"></path><path d="M12 4.5l7.5 7.5-7.5 7.5"></path></svg></span>
                </m-if>
            </a>
          </m-for>
          <m-if test="!palette.hasRows">
            <div class="result empty">No matches</div>
          </m-if>
        </div>
      </div>
    </div>
  </m-if>

  <m-menu class="menu-slot"></m-menu>
  <m-notice class="notice-slot"></m-notice>
  <m-prompt class="prompt-slot"></m-prompt>

  <!-- Right-click menus on tabs, pins, folders and spaces, and "+" (macOS-style). -->
  <template m-part="menu">
    <div class="tab-menu" role="menu" m-attr:aria-label="{{menu.label}}">
      <m-for each="menu.items" as="i">
        <m-if test="i.separator">
          <div class="menu-separator" role="separator"></div>
          <m-else>
            <button class="menu-item" role="menuitem" m-class:danger="{{i.danger}}" m-class:confirming="{{i.confirming}}" m-action="menu.run" m-arg="{{i.id}}">{{i.label}}</button>
          </m-else>
        </m-if>
      </m-for>
    </div>
  </template>

  <!-- The space editor, under the space's name. -->
  <template m-part="space-editor">
    <div class="editor" role="form" m-attr:aria-label="{{editor.labels.title}}">
      <div class="row">
        <input class="emoji" type="text" m-input="space-emoji" maxlength="8" m-attr:aria-label="{{editor.labels.emoji}}" autocomplete="off" spellcheck="false">
        <input class="name" type="text" m-input="space-name" maxlength="40" m-attr:placeholder="{{editor.labels.name}}" m-attr:aria-label="{{editor.labels.name}}" autocomplete="off" spellcheck="false">
      </div>
      <div class="swatches" role="radiogroup" m-attr:aria-label="{{editor.labels.colors}}">
        <m-for each="editor.colors" as="c">
          <button class="swatch" role="radio" title="{{c.color}}" m-attr:aria-checked="{{c.selected}}" m-style:--chip-color="{{c.color}}" m-action="editor.color" m-arg="{{c.id}}"></button>
        </m-for>
      </div>
      <div class="row actions">
        <button class="delete" title="{{editor.deleteTitle}}" m-attr:disabled="{{editor.cannotDelete}}" m-class:confirming="{{editor.confirmDelete}}" m-action="editor.delete">{{editor.deleteLabel}}</button>
        <span class="spacer"></span>
        <button m-action="editor.cancel">{{editor.labels.cancel}}</button>
        <button class="primary" m-action="editor.save">{{editor.labels.save}}</button>
      </div>
    </div>
  </template>

  <!-- A notice near the left edge (e.g. "Margin works in full screen"), with its buttons. -->
  <template m-part="notice">
    <div class="notice" role="status">
      <span class="text">{{notice.text}}</span>
      <m-for each="notice.actions" as="a">
        <button m-class:primary="{{a.primary}}" m-action="notice.run" m-arg="{{a.id}}">{{a.label}}</button>
      </m-for>
    </div>
  </template>

  <!-- Margin's prompts and confirmations (e.g. "install Margin.app"). -->
  <template m-part="prompt">
    <div class="prompt-layer">
      <div class="prompt" role="alertdialog" m-attr:aria-label="{{prompt.title}}">
        <div class="prompt-title">{{prompt.title}}</div>
        <div class="prompt-text">{{prompt.text}}</div>
        <div class="prompt-actions">
          <m-for each="prompt.actions" as="a">
            <button m-class:primary="{{a.primary}}" m-class:danger="{{a.danger}}" m-action="prompt.run" m-arg="{{a.id}}">{{a.label}}</button>
          </m-for>
        </div>
      </div>
    </div>
  </template>

  <!-- The new-tab launcher (Arcadia's newtab.html): the search field, the
       space's pins as tiles, recently archived tabs, and Settings. -->
  <template m-part="launcher">
    <main class="launcher">
      <div class="search-field">
        <input class="launcher-query" type="text" m-input="launcher" placeholder="Search or enter address" aria-label="Search or enter address" spellcheck="false" autocomplete="off">
      </div>
      <m-if test="launcher.hasPins">
        <section class="pins-tiles">
          <h2>Pinned</h2>
          <ul class="pin-tiles">
            <m-for each="launcher.pins" as="p">
              <li class="tile-item">
                <a class="tile" title="{{p.url}}" m-action="pin.open" m-arg="{{p.id}}">
                  <m-if test="p.icon">
                    <img class="avatar" alt="" m-icon="{{p.icon}}">
                    <m-else><span class="avatar letter" aria-hidden="true" m-style:--letter="{{p.color}}">{{p.letter}}</span></m-else>
                  </m-if>
                  <span class="title">{{p.title}}</span>
              </li>
            </m-for>
          </ul>
        </section>
      </m-if>
      <m-if test="launcher.hasArchive">
        <section class="archive-section">
          <h2>Recently archived</h2>
          <ul class="archive-list">
            <m-for each="launcher.archive" as="a">
              <li class="archive-item">
                <a class="archive-row" title="{{a.url}}" m-action="archive.restore" m-arg="{{a.id}}">
                  <m-if test="a.icon">
                    <img class="avatar" alt="" m-icon="{{a.icon}}">
                    <m-else><span class="avatar letter" aria-hidden="true" m-style:--letter="{{a.color}}">{{a.letter}}</span></m-else>
                  </m-if>
                  <span class="title">{{a.title}}</span>
                  <span class="when">{{a.ago}}</span>
                </a>
              </li>
            </m-for>
          </ul>
          <m-if test="launcher.more">
            <button class="archive-more" m-action="launcher.more">{{launcher.moreLabel}}</button>
          </m-if>
        </section>
      </m-if>
      <section class="settings">
        <div class="settings-summary"><button m-action="settings.open">Settings</button></div>
      </section>
    </main>
  </template>
</div>
