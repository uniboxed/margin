<div class="nb" m-attr:data-mode="{{window.mode}}" m-attr:data-sidebar="{{window.sidebar}}" m-class:framed="{{window.frameWhenHidden}}" m-class:newtab="{{launcher}}" m-style:--space="{{space.color}}">

  <div class="peek-zone" m-peek="left" aria-hidden="true"></div>

  <nav class="sidebar" aria-label="Sidebar">
    <div class="column" m-swipe="spaces">

      <div class="window-bar">
        <m-window-controls class="window-controls"></m-window-controls>
        <m-drag-region class="drag-region"></m-drag-region>
      </div>

      <div class="toolbar">
        <button class="btn push sq" aria-label="Toggle sidebar" m-attr:aria-pressed="{{window.sidebarOpen}}" m-action="sidebar.toggle">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15"></rect><path d="M9.5 4.5v15"></path></svg>
        </button>
        <div class="grow"></div>
        <button class="btn push sq" aria-label="Back" m-action="nav.back">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
        </button>
        <button class="btn push sq" aria-label="Forward" m-action="nav.forward">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </button>
        <button class="btn push sq" aria-label="Reload" m-class:loading="{{tab.loading}}" m-action="nav.reload">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4"></path></svg>
        </button>
      </div>

      <button class="btn push address" aria-label="Address: {{tab.url}}. Open command bar" m-action="palette.open">
        <svg class="ico lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="10.5" width="13" height="9"></rect><path d="M8.5 10.5V7a3.5 3.5 0 0 1 7 0v3.5"></path></svg>
        <span class="ellipsis">{{tab.host}}</span>
      </button>

      <div class="space-head swipes">
        <h2 class="space-name" m-rename="space">{{space.name}}</h2>
        <span class="pill">{{space.tabCount}} TABS</span>
      </div>

      <div class="tabs swipes" m-scroll="tabs">
        <div class="folders" m-drop="pins">
          <m-for each="space.pinned" as="g">
            <m-if test="g.isFolder">
              <div class="folder" m-class:open="{{g.open}}" m-drop="folder">
                <button class="btn row folder-head" m-attr:aria-expanded="{{g.open}}" m-action="folder.toggle" m-arg="{{g.id}}" m-drag="folder">
                  <svg class="ico chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
                  <span class="folder-name" m-rename="folder">{{g.name}}</span>
                </button>
                <m-if test="g.hasShown">
                  <div class="folder-tabs">
                    <m-for each="g.shown" as="t">
                      <a class="btn row tab pin" title="{{t.title}}" m-class:on="{{t.active}}" m-class:behind="{{t.behind}}" m-class:away="{{t.away}}" m-class:asleep="{{t.asleep}}" m-class:busy="{{t.loading}}" m-class:open="{{t.open}}" m-action="pin.open" m-arg="{{t.id}}" m-drag="pin">
                        <m-if test="t.icon">
                          <img class="fav" alt="" m-icon="{{t.icon}}">
                          <m-else><span class="fav letter" m-style:--fav="{{t.color}}">{{t.letter}}</span></m-else>
                        </m-if>
                        <span class="title">{{t.title}}</span>
                        <m-if test="t.audible"><svg class="ico audible" viewBox="0 0 24 24" role="img" aria-label="Playing audio"><path class="speaker" d="M3.5 9h4l5-4v14l-5-4h-4Z"></path><path d="M16 9a4.2 4.2 0 0 1 0 6M18.8 6.2a8.2 8.2 0 0 1 0 11.6"></path></svg></m-if>
                        <m-if test="t.open">
                          <button class="btn close" aria-label="Close tab (stays pinned)" m-action="tab.close" m-arg="{{t.tabId}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"></path></svg></button>
                        </m-if>
                      </a>
                    </m-for>
                  </div>
                </m-if>
              </div>
              <m-else>
                <!-- A pin outside the folders: the board's folder row, in a card of its own (one card for pins side by side). -->
                <div class="loose-card">
                  <a class="btn row tab pin" title="{{g.title}}" m-class:on="{{g.active}}" m-class:behind="{{g.behind}}" m-class:away="{{g.away}}" m-class:asleep="{{g.asleep}}" m-class:busy="{{g.loading}}" m-class:open="{{g.open}}" m-action="pin.open" m-arg="{{g.id}}" m-drag="pin">
                    <m-if test="g.icon">
                      <img class="fav" alt="" m-icon="{{g.icon}}">
                      <m-else><span class="fav letter" m-style:--fav="{{g.color}}">{{g.letter}}</span></m-else>
                    </m-if>
                    <span class="title">{{g.title}}</span>
                    <m-if test="g.audible"><svg class="ico audible" viewBox="0 0 24 24" role="img" aria-label="Playing audio"><path class="speaker" d="M3.5 9h4l5-4v14l-5-4h-4Z"></path><path d="M16 9a4.2 4.2 0 0 1 0 6M18.8 6.2a8.2 8.2 0 0 1 0 11.6"></path></svg></m-if>
                    <m-if test="g.open">
                      <button class="btn close" aria-label="Close tab (stays pinned)" m-action="tab.close" m-arg="{{g.tabId}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"></path></svg></button>
                    </m-if>
                  </a>
                </div>
              </m-else>
            </m-if>
          </m-for>
        </div>

        <!-- iCloud Tabs (Margin.app with Safari): a live folder above NEW TAB, outside every drop zone. -->
        <m-cloud-tabs class="cloud-slot"></m-cloud-tabs>

        <div class="today-zone" m-drop="tabs">
          <div class="divider">
            <span class="dash"></span>
            <m-if test="space.hasToday">
              <button class="btn push clear" m-action="today.clear">CLEAR ↓</button>
            </m-if>
          </div>

          <button class="btn push new-tab" m-class:on="{{space.newTab.active}}" m-action="tab.new">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            <span class="grow left">NEW TAB</span>
            <kbd class="kbd">⌘T</kbd>
          </button>

          <div class="today">
            <m-for each="space.today" as="t">
              <a class="btn row tab" title="{{t.title}}" m-class:on="{{t.active}}" m-class:behind="{{t.behind}}" m-class:away="{{t.away}}" m-class:asleep="{{t.asleep}}" m-class:busy="{{t.loading}}" m-class:not-open="{{t.notOpen}}" m-action="tab.activate" m-arg="{{t.id}}" m-drag="tab">
                <m-if test="t.icon">
                  <img class="fav" alt="" m-icon="{{t.icon}}">
                  <m-else><span class="fav letter" m-style:--fav="{{t.color}}">{{t.letter}}</span></m-else>
                </m-if>
                <span class="title">{{t.title}}</span>
                <m-if test="t.audible"><svg class="ico audible" viewBox="0 0 24 24" role="img" aria-label="Playing audio"><path class="speaker" d="M3.5 9h4l5-4v14l-5-4h-4Z"></path><path d="M16 9a4.2 4.2 0 0 1 0 6M18.8 6.2a8.2 8.2 0 0 1 0 11.6"></path></svg></m-if>
                <button class="btn close" aria-label="Close tab" m-action="tab.close" m-arg="{{t.id}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"></path></svg></button>
              </a>
            </m-for>
          </div>
        </div>
      </div>

      <div class="spaces">
        <button class="btn push sq big" aria-label="Archive and library" m-action="archive.open">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="4.5"></rect><path d="M5 9v11h14V9M10 13h4"></path></svg>
        </button>
        <div class="chips" role="group" aria-label="Spaces">
          <m-for each="spaces" as="s">
            <m-if test="s.profileStart"><span class="profile-gap" aria-hidden="true"></span></m-if>
            <button class="btn chip" aria-label="Switch to {{s.label}} space" title="{{s.label}}" m-attr:aria-pressed="{{s.active}}" m-class:on="{{s.active}}" m-class:foreign="{{s.foreign}}" m-class:switching="{{s.switching}}" m-style:--chip="{{s.color}}" m-action="space.switch" m-arg="{{s.id}}" m-drop="space">{{s.abbr}}<m-if test="s.profileMark"><span class="profile-tag" m-style:--profile="{{s.profile.color}}" aria-hidden="true"><m-if test="s.profile.symbol"><img class="profile-symbol" alt="" m-icon="{{s.profile.symbol}}"><m-else>{{s.profile.initial}}</m-else></m-if></span></m-if></button>
          </m-for>
        </div>
        <button class="btn push sq big" aria-label="New folder or space" m-action="menu.open" m-arg="add">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
      </div>

    </div>
    <div class="resizer" m-resize="sidebar" title="Drag to resize · double-click to reset" aria-hidden="true"></div>
  </nav>

  <m-page class="page"></m-page>

  <!-- The page loading (the tab in front: its load, the page being left, a
       site's own navigation): a marching stripe in the gutter above the page,
       seen with the sidebar hidden too. -->
  <div class="load-bar" m-class:on="{{tab.loading}}" aria-hidden="true"></div>

  <!-- Margin's trackpad gestures on the page (pull to refresh, swipe back
       and forward): a badge over the page that comes in with the fingers and
       fills once letting go would do it. Never takes the pointer. -->
  <div class="page-over" aria-hidden="true">
    <m-if test="gesture.pull">
      <div class="gesture pull" m-class:armed="{{gesture.armed}}" m-class:done="{{gesture.done}}" m-class:leaving="{{gesture.leaving}}" m-style:--gesture="{{gesture.progress}}">
        <svg class="ico" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4"></path></svg>
      </div>
    </m-if>
    <m-if test="gesture.swipe">
      <div class="gesture swipe" m-class:back="{{gesture.back}}" m-class:forward="{{gesture.forward}}" m-class:armed="{{gesture.armed}}" m-class:done="{{gesture.done}}" m-class:leaving="{{gesture.leaving}}" m-style:--gesture="{{gesture.progress}}">
        <svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></svg>
      </div>
    </m-if>
  </div>

  <m-if test="palette.open">
    <div class="palette-layer">
      <button class="btn scrim" aria-label="Close command bar" m-action="palette.close"></button>
      <div class="palette" role="dialog" aria-label="New tab">
        <label class="palette-label" for="palette-input">SEARCH OR TYPE A URL</label>
        <input id="palette-input" class="palette-input" m-input="palette" placeholder="Go anywhere…" autocomplete="off" spellcheck="false">
        <!-- At most eight rows show; the rest scroll (Margin keeps the selected one in view). -->
        <div class="palette-rows" m-scroll="palette">
          <m-for each="palette.rows" as="r">
            <!-- A run of rows from one place (iCloud Tabs: "On Nora's iPhone"): its heading. -->
            <m-if test="r.sectionStart"><div class="palette-section" aria-hidden="true">{{r.section}}</div></m-if>
            <button class="btn row palette-row" m-class:on="{{r.selected}}" m-attr:aria-description="{{r.section}}" m-action="palette.run" m-arg="{{r.id}}">
              <!-- The board's tag (TAB, ASK): here the row's badge (its space, Archived, Search…), in that space's color, one width for all. -->
              <m-if test="r.badge"><span class="tag" m-style:--tag="{{r.spaceColor}}">{{r.badge}}</span></m-if>
              <m-if test="r.isSearch">
                <span class="fav glyph" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"></circle><path d="M15 15l5 5"></path></svg></span>
                <m-else>
              <m-if test="r.isOpen">
                <span class="fav glyph" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><path d="M8 16 17 7M9 7h8v8"></path></svg></span>
                <m-else>
              <m-if test="r.emoji">
                <span class="fav emoji" aria-hidden="true">{{r.emoji}}</span>
                <m-else>
                  <m-if test="r.icon">
                    <img class="fav" alt="" m-icon="{{r.icon}}">
                    <m-else><span class="fav letter" aria-hidden="true" m-style:--fav="{{r.color}}">{{r.letter}}</span></m-else>
                  </m-if>
                </m-else>
              </m-if>
                </m-else>
              </m-if>
                </m-else>
              </m-if>
              <span class="grow left ellipsis">{{r.title}}</span>
              <span class="enter">↵</span>
            </button>
          </m-for>
        </div>
      </div>
    </div>
  </m-if>

  <m-launcher class="launcher-slot"></m-launcher>
  <!-- A switch to another profile getting ready (Margin.app): the page card covered. -->
  <m-switch-cover class="switch-cover-slot"></m-switch-cover>
  <m-menu class="menu-slot"></m-menu>
  <m-editor class="editor-slot"></m-editor>
  <m-notice class="notice-slot"></m-notice>
  <m-prompt class="prompt-slot"></m-prompt>

  <!-- iCloud Tabs: the tabs open on the person's other devices. A folder card
       with a sky-blue head and a cloud, nothing to drag in or out; each
       device a black tag with its icon and name and when it was last used,
       its tabs under it. Every word is Margin's (a guarded part). -->
  <template m-part="cloud-tabs">
    <div class="cloud" role="group" m-attr:aria-label="{{cloudTabs.labels.title}}" m-class:open="{{cloudTabs.open}}">
      <button class="btn row cloud-head" title="{{cloudTabs.labels.toggle}}" m-attr:aria-expanded="{{cloudTabs.open}}" m-action="cloud.toggle">
        <svg class="ico chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        <svg class="ico cloud-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18.5h10.5a3.75 3.75 0 0 0 .4-7.48A5.75 5.75 0 0 0 6.9 9.6 4.45 4.45 0 0 0 7 18.5Z"></path></svg>
        <span class="cloud-name">{{cloudTabs.labels.title}}</span>
        <m-if test="cloudTabs.hasCount"><span class="folder-count">{{cloudTabs.count}}</span></m-if>
      </button>
      <m-if test="cloudTabs.open">
        <div class="cloud-body">
          <m-if test="cloudTabs.hasMessage">
            <div class="cloud-note" role="status">
              <span class="text">{{cloudTabs.message}}</span>
              <m-if test="cloudTabs.canFix"><button class="btn push small cloud-fix" m-action="cloud.access">{{cloudTabs.labels.fix}}</button></m-if>
            </div>
          </m-if>
          <m-for each="cloudTabs.devices" as="d">
            <button class="btn cloud-device" data-device-id="{{d.id}}" title="{{d.describe}}" m-class:open="{{d.open}}" m-class:stale="{{d.stale}}" m-attr:aria-expanded="{{d.open}}" m-attr:aria-label="{{d.describe}}" m-action="cloud.toggleDevice" m-arg="{{d.id}}">
              <span class="device-tag">
                <m-if test="d.isPhone"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19"></rect><path d="M10.5 18h3"></path></svg></m-if>
                <m-if test="d.isPad"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="2.5" width="15" height="19"></rect><path d="M10.5 18h3"></path></svg></m-if>
                <m-if test="d.isMac"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="10"></rect><path d="M2.5 18.5h19"></path></svg></m-if>
                <m-if test="d.isVision"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 11c0-2.8 2-4.5 5-4.5h9c3 0 5 1.7 5 4.5 0 3-1.8 5.2-4.4 5.2-2.1 0-2.9-1.7-5.1-1.7s-3 1.7-5.1 1.7C4.3 16.2 2.5 14 2.5 11Z"></path></svg></m-if>
                <m-if test="d.isOther"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c-4.6 5-4.6 13 0 18M12 3c4.6 5 4.6 13 0 18"></path></svg></m-if>
                <span class="device-name">{{d.name}}</span>
              </span>
              <span class="device-when">{{d.updated}}</span>
            </button>
            <m-for each="d.shown" as="t">
              <button class="btn row cloud-tab" data-cloud-tab-id="{{t.id}}" title="{{t.url}}" m-class:stale="{{d.stale}}" m-attr:aria-label="{{t.label}}" m-action="cloud.open" m-arg="{{t.id}}">
                <m-if test="t.icon">
                  <img class="fav" alt="" m-icon="{{t.icon}}">
                  <m-else><span class="fav letter" aria-hidden="true" m-style:--fav="{{t.color}}">{{t.letter}}</span></m-else>
                </m-if>
                <span class="cloud-text">
                  <span class="title">{{t.title}}</span>
                  <span class="cloud-host">{{t.host}}</span>
                </span>
                <m-if test="t.pinned">
                  <span class="pinned-mark" title="{{cloudTabs.labels.pinned}}"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l-.8 6.2L17.5 12.5v1.5h-11v-1.5l3.3-3.3ZM12 14v7"></path></svg></span>
                </m-if>
              </button>
            </m-for>
          </m-for>
        </div>
      </m-if>
    </div>
  </template>

  <template m-part="notice">
    <div class="notice" role="status">
      <span class="text">{{notice.text}}</span>
      <m-for each="notice.actions" as="a">
        <button class="btn push small" m-class:primary="{{a.primary}}" m-action="notice.run" m-arg="{{a.id}}">{{a.label}}</button>
      </m-for>
    </div>
  </template>

  <template m-part="prompt">
    <div class="prompt-layer">
      <div class="prompt" role="alertdialog" m-attr:aria-label="{{prompt.title}}">
        <div class="prompt-title">{{prompt.title}}</div>
        <div class="prompt-text">{{prompt.text}}</div>
        <div class="prompt-actions">
          <m-for each="prompt.actions" as="a">
            <button class="btn push small" m-class:primary="{{a.primary}}" m-class:danger="{{a.danger}}" m-action="prompt.run" m-arg="{{a.id}}">{{a.label}}</button>
          </m-for>
        </div>
      </div>
    </div>
  </template>

  <!-- The switching cover: a yellow card on the space's dots, a black tag
       with the profile's mark, "Switching to Work…", the space under it. -->
  <template m-part="switch-cover">
    <div class="switch-cover" role="status" m-attr:aria-label="{{switchCover.label}}">
      <div class="switch-cover-card">
        <span class="switch-cover-mark" aria-hidden="true" m-style:--profile="{{switchCover.profile.color}}">
          <m-if test="switchCover.profile.emoji">{{switchCover.profile.emoji}}<m-else>{{switchCover.profile.initial}}</m-else></m-if>
        </span>
        <span class="switch-cover-text">{{switchCover.text}}</span>
        <m-if test="switchCover.hasSpace"><span class="switch-cover-space">{{switchCover.space.emoji}} {{switchCover.space.name}}</span></m-if>
      </div>
    </div>
  </template>

  <template m-part="launcher">
    <main class="launcher">
      <input class="launcher-query" m-input="launcher" placeholder="Go anywhere…" aria-label="Search or enter address" spellcheck="false" autocomplete="off">
      <m-if test="launcher.hasPins">
        <section>
          <h2>Pinned</h2>
          <ul class="pin-tiles">
            <m-for each="launcher.pins" as="p">
              <li>
                <a class="tile" title="{{p.url}}" m-action="pin.open" m-arg="{{p.id}}">
                  <m-if test="p.icon">
                    <img class="fav" alt="" m-icon="{{p.icon}}">
                    <m-else><span class="fav letter" m-style:--fav="{{p.color}}">{{p.letter}}</span></m-else>
                  </m-if>
                  <span class="title">{{p.title}}</span>
                </a>
              </li>
            </m-for>
          </ul>
        </section>
      </m-if>
      <m-if test="launcher.hasArchive">
        <section>
          <h2>Recently archived</h2>
          <ul class="archive-list">
            <m-for each="launcher.archive" as="a">
              <li>
                <a class="archive-row" title="{{a.url}}" m-action="archive.restore" m-arg="{{a.id}}">
                  <m-if test="a.icon">
                    <img class="fav" alt="" m-icon="{{a.icon}}">
                    <m-else><span class="fav letter" m-style:--fav="{{a.color}}">{{a.letter}}</span></m-else>
                  </m-if>
                  <span class="title">{{a.title}}</span>
                  <span class="when">{{a.ago}}</span>
                </a>
              </li>
            </m-for>
          </ul>
          <m-if test="launcher.more">
            <button class="btn push small" m-action="launcher.more">{{launcher.moreLabel}}</button>
          </m-if>
        </section>
      </m-if>
      <section>
        <button class="btn push small" m-attr:aria-expanded="{{launcher.settingsOpen}}" m-action="settings.open">Settings</button>
        <m-settings></m-settings>
      </section>
    </main>
  </template>

  <template m-part="settings">
    <div class="settings-form">
      <m-for each="settingsForm.fields" as="f">
        <m-if test="f.isGroup"><div class="setting-group" role="heading" aria-level="3">{{f.label}}</div></m-if>
        <m-if test="f.isInfo"><p class="help">{{f.label}}</p></m-if>
        <m-if test="f.isNumber"><label class="setting"><span>{{f.label}}</span><input class="number" m-input="setting-number"></label></m-if>
        <m-if test="f.isToggle"><label class="setting" m-class:disabled="{{f.disabled}}"><span>{{f.label}}</span><input class="toggle" m-input="setting-toggle"></label></m-if>
        <m-if test="f.isChoice">
          <label class="setting"><span>{{f.label}}</span><select m-input="setting-choice"></select></label>
          <m-if test="f.hasStatus"><p class="help" role="status" m-class:error="{{f.error}}">{{f.status}}</p></m-if>
        </m-if>
        <m-if test="f.isList"><label class="setting stacked"><span>{{f.label}}</span><textarea m-input="setting-list" rows="3" spellcheck="false"></textarea></label></m-if>
        <m-if test="f.isColor"><label class="setting" m-class:theme-own="{{f.fromTheme}}"><span>{{f.label}}</span><input class="color" m-input="setting-color"></label></m-if>
        <m-if test="f.isShortcut"><label class="setting"><span>{{f.label}}</span><input class="shortcut" m-input="setting-shortcut" m-class:recording="{{f.recording}}"></label></m-if>
        <m-if test="f.isButton">
          <div class="actions">
            <button class="btn push small" m-action="settings.run" m-arg="{{f.id}}">{{f.label}}</button>
            <m-if test="f.hasStatus"><span class="help" role="status" m-class:error="{{f.error}}">{{f.status}}</span></m-if>
          </div>
        </m-if>
      </m-for>
    </div>
  </template>

  <template m-part="menu">
    <div class="menu" role="menu" m-attr:aria-label="{{menu.label}}">
      <m-for each="menu.items" as="i">
        <m-if test="i.separator">
          <div class="menu-sep" role="separator"></div>
          <m-else>
            <button class="btn menu-item" role="menuitem" m-class:danger="{{i.danger}}" m-class:confirming="{{i.confirming}}" m-action="menu.run" m-arg="{{i.id}}">{{i.label}}</button>
          </m-else>
        </m-if>
      </m-for>
    </div>
  </template>

  <template m-part="space-editor">
    <div class="editor-layer">
      <button class="btn scrim" m-attr:aria-label="{{editor.labels.cancel}}" m-action="editor.cancel"></button>
      <div class="editor" role="dialog" m-attr:aria-label="{{editor.labels.title}}">
        <div class="editor-title">{{editor.labels.title}}</div>
        <div class="editor-row">
          <input class="editor-emoji" m-input="space-emoji" maxlength="8" m-attr:aria-label="{{editor.labels.emoji}}" autocomplete="off" spellcheck="false">
          <input class="editor-name" m-input="space-name" maxlength="40" m-attr:placeholder="{{editor.labels.name}}" m-attr:aria-label="{{editor.labels.name}}" m-attr:disabled="{{editor.nameLocked}}" autocomplete="off" spellcheck="false">
        </div>
        <m-if test="editor.nameLocked"><div class="editor-note">{{editor.labels.note}}</div></m-if>
        <div class="swatches" role="radiogroup" m-attr:aria-label="{{editor.labels.colors}}">
          <m-for each="editor.colors" as="c">
            <button class="btn swatch" role="radio" m-attr:aria-checked="{{c.selected}}" m-class:on="{{c.selected}}" m-style:--swatch="{{c.color}}" m-action="editor.color" m-arg="{{c.id}}"></button>
          </m-for>
        </div>
        <div class="editor-row actions">
          <button class="btn push small danger" title="{{editor.deleteTitle}}" m-attr:disabled="{{editor.cannotDelete}}" m-class:confirming="{{editor.confirmDelete}}" m-action="editor.delete">{{editor.deleteLabel}}</button>
          <div class="grow"></div>
          <button class="btn push small" m-action="editor.cancel">{{editor.labels.cancel}}</button>
          <button class="btn push small primary" m-action="editor.save">{{editor.labels.save}}</button>
        </div>
      </div>
    </div>
  </template>
</div>
