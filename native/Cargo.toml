# Margin's native shells in Rust (native/BRIEF.md): margin-core is OS-neutral and tested on any OS;
# margin-windows is the Windows shell. macOS stays Swift (app/shell/).
[workspace]
resolver = "3"
members = ["margin-core", "margin-windows"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
hex = "0.4"
tempfile = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
