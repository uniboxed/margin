<!--
pattern: a class on <html> that sets its width or height doesn't undo the box
from: islonline.net (fit-check round 1): Bootstrap's `w-100` and `h-100` on <html>, `width: 100% !important`, beat the box's own
handled-by: shared/page-box.ts (boxCss: the box's <html> rule outweighs a page's classes)
-->
<!doctype html>
<html class="w-100 h-100" lang="en">
<head>
<meta charset="utf-8">
<title>html-class-width</title>
<style>
  .w-100 { width: 100% !important; }
  .h-100 { height: 100% !important; }
  body { margin: 0; font: 16px/1.4 -apple-system, system-ui, sans-serif; }
  nav { display: flex; justify-content: space-between; padding: 12px 16px; background: #1d1d1f; color: #fff; }
  main { padding: 24px 16px; max-width: 520px; margin: 0 auto; }
  footer { display: flex; justify-content: space-between; padding: 12px 16px; border-top: 1px solid #ddd; }
</style>
</head>
<body class="h-100">
<nav id="nav"><b>Logo</b><span><a href="#">Join</a> · <a href="#">Downloads</a> · <a href="#" id="login">Login</a></span></nav>
<main id="main"><h1>Join a session</h1><p>Enter the code you were given to join the session.</p><input id="code" placeholder="Session code"></main>
<footer id="foot"><span>© 2026</span><a href="#" id="manuals">Manuals</a></footer>
</body>
</html>
