<!--
pattern: a scroll-linked animation on the document's scroll (ScrollTimeline on <html>, or with no source) runs on the box's
from: cxense.com (fit-check round 1, re-checked): Framer's motion drives its fixed hero from `new ScrollTimeline({ source: document.documentElement })`; in the box <html> doesn't scroll, the timeline was inactive (null), and the hero was put at its end, 1000px up: a blank page
handled-by: content/page/timelines.ts (ScrollTimeline on the box's scroller)
settle: 700
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>scroll-timeline</title>
<style>
  body { margin: 0; font: 16px/1.4 -apple-system, system-ui, sans-serif; }
  #hero { position: fixed; left: 50%; top: 0; width: 400px; height: 200px; background: #cde; }
  section { height: 2000px; }
</style>
</head>
<body>
<div id="hero">A hero that moves up as the page scrolls</div>
<section></section>
<p>html: <output id="html"></output>, no source: <output id="none"></output>, an instance: <output id="kind"></output></p>
<script>
  const say = (id, text) => { document.getElementById(id).textContent = text; };
  const at = (t) => (t.currentTime == null ? 'inactive' : `${Math.round(t.currentTime.value ?? t.currentTime)}`);
  addEventListener('load', () => setTimeout(() => {
    if (typeof ScrollTimeline === 'undefined') { say('html', 'none'); say('none', 'none'); say('kind', 'none'); return; }
    const onHtml = new ScrollTimeline({ source: document.documentElement, axis: 'y' });
    const bare = new ScrollTimeline();
    say('html', at(onHtml));
    say('none', at(bare));
    say('kind', String(onHtml instanceof ScrollTimeline && onHtml instanceof AnimationTimeline));
    // As a motion library does: the hero placed by the scroll's progress, its end if it can't tell.
    const progress = onHtml.currentTime == null ? 1 : (onHtml.currentTime.value ?? 0) / 100;
    document.getElementById('hero').style.transform = `translateX(-50%) translateY(${-1000 * progress}px)`;
  }, 100));
</script>
</body>
</html>
